name: projet_hydro

# Le code est bind-monté, les données arrivent par `dvc pull`.
# api + mlflow n'exposent plus de port directement : nginx est le seul point
# d'entrée réseau (mêmes ports externes qu'avant -- rien ne change pour
# l'utilisateur/`.env`). MinIO reste direct (cf. note dans le README) --
# c'est un outil d'admin interne, pas un service applicatif.

x-env: &env
  DAGSHUB_USER: ${DAGSHUB_USER:-}
  DAGSHUB_TOKEN: ${DAGSHUB_TOKEN:-}
  GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-projet_hydro}
  GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-projet_hydro@localhost}
  # .env porte l'URL vue de l'hôte (localhost) ; dans le réseau compose c'est le
  # nom du service. `:+` = "si non vide, remplace par" -- vide reste vide.
  MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:+http://mlflow:5000}

services:
  app:
    build: .
    image: projet_hydro:latest
    working_dir: /app
    environment: *env
    volumes:
      - .:/app
    # Défaut : lance la suite de tests. Sinon :
    #   docker compose run --rm app dvc pull
    #   docker compose run --rm app python cron/scripts/train.py --dossier touzac_g2_G2 --horizon 8
    command: ["python", "-m", "pytest", "-q"]

  api:
    build: .
    image: projet_hydro:latest
    working_dir: /app
    environment: *env
    volumes:
      - .:/app
    # Pas de `ports:` -- accessible via nginx (localhost:8000), même URL qu'avant.
    command:
      - uvicorn
      - projet_hydro.serving.api:app
      - --host=0.0.0.0
      - --port=8000

  # Serveur de suivi d'expériences. Backend SQLite : le Model Registry exige
  # une base, SQLite suffit largement pour 2 centrales x 1 horizon et se
  # sauvegarde en copiant un fichier.
  #
  # --serve-artifacts est indispensable ici : les entrainements tournent sur
  # l'HOTE (env conda) et le serveur dans le conteneur. Sans lui, le client
  # recoit un chemin local (/mlflow/artifacts) et ecrit a cote -- sur Windows
  # il creerait un dossier mlflow/artifacts sur C:, invisible du conteneur,
  # et l'onglet Artifacts resterait vide sans erreur. Avec, le client recoit une
  # URI mlflow-artifacts:/ et televerse a travers le serveur.
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow  # image officielle + boto3 (client S3 vers MinIO)
    working_dir: /mlflow
    # Pas de `ports:` -- accessible via nginx (localhost:5000), même URL qu'avant.
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - mlflow-data:/mlflow
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination=s3://mlflow-artifacts

  # --- Phase 2.6 : stockage objet des artefacts MLflow (remplace le volume local) ---
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"   # API S3 (utilisée par mlflow en interne, exposée pour debug)
      - "9001:9001"   # console web -- direct, pas derrière nginx (cf. README)
    volumes:
      - minio-data:/data

  minio-setup:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo attente minio...
          sleep 1
        done
        mc mb -p local/mlflow-artifacts || true
        mc ls local/mlflow-artifacts >/dev/null
        echo bucket mlflow-artifacts pret

  # --- Phase 3.4 : démonstration de serving via BentoML (en plus de l'API
  # FastAPI) -- même logique de prévision (predict_service.py), pas exposé
  # via nginx : c'est une démo de compétence, pas un 2e chemin de prod.
  bento:
    build:
      context: .
      dockerfile: Dockerfile.bento
    volumes:
      - .:/app
    ports:
      - "3000:3000"

  # --- Phase 2.5 : reverse proxy (point d'entrée unique api + mlflow) ---
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:8000"   # -> api   (identique à avant)
      - "5000:5000"   # -> mlflow (identique à avant)
    depends_on:
      - api
      - mlflow

  # --- Phase 4.1 : monitoring -- direct, pas derrière nginx (outils d'admin
  # interne à l'équipe, comme la console MinIO ; même raisonnement). Prometheus
  # scrape l'API en interne (api:8000/metrics), pas besoin de nginx pour ça.
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
      - node-exporter

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"   # 3000 déjà pris par bento (phase 3.4)
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.8.2
    ports:
      - "9100:9100"

volumes:
  mlflow-data:
  grafana-data:
  minio-data:
