name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      # Vide = training_run() no-op -- la CI ne dépend d'aucun serveur MLflow.
      MLFLOW_TRACKING_URI: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installe les dépendances (torch CPU + package + dev)
        run: |
          pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (rapides -- sans -m slow, sans données DagsHub)
        run: pytest -q
