stages:
  memorandum:
    wdir: ../..
    cmd: .venv/bin/python cron/scripts/majdata-memo.py
    deps:
      - src/previ_r2d2/preprocessing/onegate/memorandum.py
      - src/previ_r2d2/common/onegate.py
    always_changed: true
    outs:
      - centrales/REFERENCE/config-general.json:
          cache: false

  debit:
    wdir: ../..
    cmd: .venv/bin/python cron/scripts/maj-data.py
    deps:
      - centrales/REFERENCE/config-general.json
      - logs/dvc_markers/puissance.json
      - src/previ_r2d2/preprocessing/debit/
    # Sans outs: (cf. commentaire du fichier), DVC ne voit jamais changer les
    # dépendances déclarées (config-general.json, code) au fil des runs -- la
    # vraie source (Hub'Eau/eaufrance) est externe et non trackée par DVC.
    # always_changed force l'exécution à chaque `dvc repro`, le script gérant
    # lui-même son incrémental ("dernier point du CSV -> maintenant").
    always_changed: true
    outs:
      - logs/dvc_markers/debit.json:
          cache: false

  puissance:
    wdir: ../..
    cmd: .venv/bin/python cron/scripts/maj-puissance.py
    deps:
      - centrales/REFERENCE/config-general.json
      - src/previ_r2d2/preprocessing/puissance/
    # Idem debit : source réelle (hydrospot_stream) hors DVC, toujours forcer.
    always_changed: true
    outs:
      - logs/dvc_markers/puissance.json:
          cache: false

  debit_automate:
    wdir: ../..
    cmd: .venv/bin/python cron/scripts/maj-automate.py
    deps:
      - centrales/REFERENCE/config-general.json
      - centrales/REFERENCE/automate_sync.yaml
      - centrales/REFERENCE/automate_physics.yaml
      - logs/dvc_markers/puissance.json
      - src/previ_r2d2/preprocessing/automate/
    # Idem debit/puissance : source réelle (rsync hydrospot) hors DVC, toujours forcer.
    always_changed: true
    outs:
      - logs/dvc_markers/debit_automate.json:
          cache: false

  onboarding_check:
    wdir: ../..
    cmd: .venv/bin/python cron/scripts/onboarding-check.py
    deps:
      - centrales/REFERENCE/config-general.json
      - logs/dvc_markers/puissance.json
      - logs/dvc_markers/debit.json
      - logs/dvc_markers/debit_automate.json
      - src/previ_r2d2/preprocessing/onboarding/validation.py
    always_changed: true
    outs:
      - logs/dvc_markers/onboarding.json:
          cache: false

  data_preparation:
    wdir: ../..
    cmd: .venv/bin/python cron/scripts/build-data-preparation.py
    deps:
      - logs/dvc_markers/debit.json
      - logs/dvc_markers/debit_automate.json
      - logs/dvc_markers/puissance.json
      - logs/dvc_markers/bv.json
      - centrales/REFERENCE/config-general.json
      - src/previ_r2d2/preprocessing/data_preparation/
      - src/previ_r2d2/preprocessing/meteo/
    # Comme debit/puissance/debit_automate : la vraie donnée (débit/météo déjà
    # écrits par les stages amont) est hors DVC -- toujours forcer, le script
    # gère lui-même son incrémental (reprise juste après le dernier point).
    always_changed: true
    outs:
      - logs/dvc_markers/data_preparation.json:
          cache: false

  daily_sync_report:
    wdir: ../..
    cmd: .venv/bin/python cron/scripts/daily-sync-report.py
    deps:
      - cron/scripts/maj-data.py
      - cron/scripts/maj-automate.py
      - cron/scripts/maj-puissance.py
      - src/previ_r2d2/common/daily_report.py
      - logs/daily_sync_state/

  bv:
    wdir: ../..
    # Pas de --mnt ici : DVC ne résout ${...} que via vars:/params:, jamais
    # l'environnement OS. onboarding-bv.py retombe déjà sur $PREVI_MNT via
    # config.PREVI_MNT si --mnt est omis (même pattern que debit/puissance).
    cmd: .venv/bin/python cron/scripts/onboarding-bv.py batch
    deps:
      - centrales/REFERENCE/config-general.json
      - centrales/REFERENCE/bv_rules.json
      - centrales/REFERENCE/centrales_calibration.json
      - centrales/REFERENCE/shapefiles/
      - config/bv_mapping.yaml
      - logs/dvc_markers/onboarding.json
      - src/previ_r2d2/preprocessing/bv/
    outs:
      - logs/dvc_markers/bv.json:
          cache: false
