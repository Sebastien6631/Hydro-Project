stages:
  debit:
    wdir: ../..
    cmd: python cron/scripts/maj-data.py
    deps:
      - centrales/REFERENCE/config-general.json
      - src/previ_r2d2/preprocessing/debit/
    # Sans outs: (source réelle Hub'Eau externe, non trackée par DVC) --
    # always_changed force l'exécution à chaque `dvc repro`, le script
    # gérant lui-même son incrémental ("dernier point du CSV -> maintenant").
    always_changed: true
    outs:
      - logs/dvc_markers/debit.json:
          cache: false

  onboarding_check:
    wdir: ../..
    cmd: python cron/scripts/onboarding-check.py
    deps:
      - centrales/REFERENCE/config-general.json
      - logs/dvc_markers/debit.json
      - src/previ_r2d2/preprocessing/onboarding/validation.py
    always_changed: true
    outs:
      - logs/dvc_markers/onboarding.json:
          cache: false

  data_preparation:
    wdir: ../..
    cmd: python cron/scripts/build-data-preparation.py
    deps:
      - logs/dvc_markers/debit.json
      - logs/dvc_markers/onboarding.json
      - centrales/REFERENCE/config-general.json
      - src/previ_r2d2/preprocessing/data_preparation/
      - src/previ_r2d2/preprocessing/meteo/open_meteo.py
    # Deux sources externes non trackées par DVC : Hub'Eau (débit, déjà écrit
    # par le stage amont) et l'API météo, interrogée à chaque exécution. D'où
    # always_changed -- le script gère lui-même son incrémental côté débit,
    # et la météo est refetchée sur la fenêtre demandée.
    always_changed: true
    outs:
      - logs/dvc_markers/data_preparation.json:
          cache: false

  validate:
    wdir: ../..
    cmd: python cron/scripts/validate-data.py
    deps:
      - logs/dvc_markers/data_preparation.json
      - src/previ_r2d2/preprocessing/data_preparation/validation.py
    # Comme les stages amont : la vraie donnée (centrales/<d>/data_preparation.csv)
    # est hors DVC, on force à chaque repro. Erreur de contrat -> exit != 0 -> repro stoppe.
    always_changed: true
    outs:
      - logs/dvc_markers/validate.json:
          cache: false
