stages:
  predict_archive:
    wdir: ../..
    cmd: python cron/scripts/predict-archive.py
    deps:
      # Les modèles EN PRODUCTION, produits par le stage `train` (via
      # promote_model, qui les dvc-add). On dépend de l'ARTEFACT, pas du
      # marker d'entraînement : `train` est always_changed, donc en dépendre
      # ferait ré-entraîner avant chaque prédiction horaire -- bug de prod
      # déjà rencontré et corrigé (cf. ab75b0f), à ne pas réintroduire.
      - models/apas_G1_G4/h8
      - models/touzac_g2_G2/h8
      - src/projet_hydro/model/pipeline/predict_orchestrator.py
      - src/projet_hydro/postprocessing/archive.py
      - cron/scripts/predict-archive.py
    # Tourne toutes les heures, greffé sur le même appel dvc repro que
    # debit (dvc/preprocessing/dvc.yaml) -- comme lui, la vraie donnée
    # (nouvelle heure observée) est externe à DVC, toujours forcer.
    always_changed: true
    outs:
      - logs/dvc_markers/predict_archive.json:
          cache: false
