stages:
  predict_archive:
    wdir: ../..
    cmd: .venv/bin/python cron/scripts/predict-archive.py
    deps:
      - logs/dvc_markers/train_new.json
      - logs/dvc_markers/train_monthly.json
      - src/previ_r2d2/model/pipeline/predict_orchestrator.py
      - src/previ_r2d2/postprocessing/archive.py
      - cron/scripts/predict-archive.py
    # Tourne toutes les heures, greffé sur le même appel dvc repro que
    # debit (dvc/preprocessing/dvc.yaml) -- comme lui, la vraie donnée
    # (nouvelle heure observée) est externe à DVC, toujours forcer.
    always_changed: true
    outs:
      - logs/dvc_markers/predict_archive.json:
          cache: false
