# Reverse proxy -- un seul conteneur exposé, HTTPS uniquement pour le trafic
# applicatif (phase 3.6) : le port historique de chaque service (8000 API,
# 5000 MLflow, 8080 Airflow) redirige (301) vers son équivalent HTTPS
# (mêmes numéros +443 : 8443/5443/8843) plutôt que de servir du HTTP.
#
# Certificat auto-signé (`infrastructure/nginx/generate-cert.sh`, lancé par le
# service compose `nginx-cert-init`) -- pas de nom de domaine réel pour ce
# projet de cours. Limite assumée et documentée dans le README : le
# navigateur/curl doivent accepter explicitement ce certificat (`-k` en curl,
# clic "avancé -> continuer" en navigateur), une vraie mise en prod voudrait
# un certificat signé (Let's Encrypt) derrière un nom de domaine.
#
# `set $upstream ...; proxy_pass $upstream;` + `resolver` = résolution DNS
# PARESSEUSE (à chaque requête, pas au démarrage) -- nginx démarre même si
# api/mlflow ne sont pas encore prêts, au lieu d'échouer immédiatement.
events {}

http {
  resolver 127.0.0.11 valid=10s;

  # Même certificat pour les 3 services (self-signed, CN=localhost) --
  # hérité par tous les `server` avec `listen ... ssl` qui ne le redéfinissent
  # pas (directive valide en contexte http ET server).
  ssl_certificate     /etc/nginx/certs/nginx.crt;
  ssl_certificate_key /etc/nginx/certs/nginx.key;

  # Phase 3.3 : rate-limit sur l'API (10 req/s/IP, rafale tolérée 20) --
  # MLflow n'est pas exposé au public (usage interne équipe), pas limité.
  limit_req_zone $binary_remote_addr zone=api_rl:10m rate=10r/s;

  server {
    listen 8000;
    return 301 https://$host:8443$request_uri;
  }

  server {
    listen 8443 ssl;
    location / {
      limit_req zone=api_rl burst=20 nodelay;
      # /predict entraîne le modèle hybride (LightGBM+BiLSTM) -- plus lent
      # qu'un GET classique, d'où un read_timeout généreux plutôt que le
      # défaut nginx (60s suffit largement en pratique, marge de sécurité).
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      set $upstream http://api:8000;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 5000;
    return 301 https://$host:5443$request_uri;
  }

  server {
    listen 5443 ssl;
    location / {
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      set $upstream http://mlflow:5000;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  # Phase 3.1 : UI Airflow. Routage par port comme les deux autres -- pas de
  # sous-chemin, donc pas de AIRFLOW__API__BASE_URL a configurer.
  server {
    listen 8080;
    return 301 https://$host:8843$request_uri;
  }

  server {
    listen 8843 ssl;
    location / {
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      set $upstream http://airflow:8080;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
