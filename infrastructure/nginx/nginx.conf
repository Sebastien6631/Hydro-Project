# Reverse proxy -- un seul conteneur exposé aux mêmes ports externes que
# précédemment (8000 API, 5000 MLflow) : rien ne change côté client/`.env`.
# `set $upstream ...; proxy_pass $upstream;` + `resolver` = résolution DNS
# PARESSEUSE (à chaque requête, pas au démarrage) -- nginx démarre même si
# api/mlflow ne sont pas encore prêts, au lieu d'échouer immédiatement.
events {}

http {
  resolver 127.0.0.11 valid=10s;

  server {
    listen 8000;
    location / {
      set $upstream http://api:8000;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 5000;
    location / {
      set $upstream http://mlflow:5000;
      proxy_pass $upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
