# Scrape l'API en direct sur le réseau compose (api:8000) -- pas besoin de
# passer par nginx, Prometheus est interne au réseau docker comme l'API elle-même.
global:
  scrape_interval: 15s

rule_files:
  - alert_rules.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
