bonneval_G2:
  source_host: "sebastien@hydrospot.prosohost.fr"
  source_base: "/tmp/sebastien/bonneval/mes"
  dest_base: "/mnt/nasGB/sebastien/DATA_TOKAPI/BourgSaintMaurice_Bonneval_G2_clean"
  variables: [NIV_AMONT_Brut, NIV_AMONT_Filtre, PosDir, Pression]
  corrections:
    Pression: {multiply: 10, offset: 0}

melles:
  source_host: "sebastien@hydrospot.prosohost.fr"
  source_base: "/tmp/sebastien/melles/mes"
  dest_base: "/mnt/nasGB/sebastien/DATA_TOKAPI/Melles_Seriail_G1_clean"
  variables: [ML2_NVO_PLAN_DO_MM_MDN, ML2_NVO_PLAN_DO_MM_MRS, ML2_P_CONDUITE_NETTE,
              ML2_POS_STAB_INJEC1_G1, ML2_POS_STAB_INJEC2_G1, ML2_POS_STAB_INJEC3_G1,
              ML2_POS_STAB_INJEC4_G1, ML2_POS_STAB_INJEC5_G1]
  # Dossier source distant (nomenclature hydrospot) -> dossier destination local
  # (nomenclature TokAPI/automate) -- contrairement à Bonneval, les deux ne
  # partagent pas le même nom côté Melles (cf. config_sync.yaml/sync_melles.py Previ_v2).
  source_names:
    ML2_NVO_PLAN_DO_MM_MDN: NIV_AMONT_Brut
    ML2_NVO_PLAN_DO_MM_MRS: NIV_AMONT_Brut_2
    ML2_P_CONDUITE_NETTE: Pression
    ML2_POS_STAB_INJEC1_G1: PosInj1
    ML2_POS_STAB_INJEC2_G1: PosInj2
    ML2_POS_STAB_INJEC3_G1: PosInj3
    ML2_POS_STAB_INJEC4_G1: PosInj4
    ML2_POS_STAB_INJEC5_G1: PosInj5
  corrections:
    ML2_NVO_PLAN_DO_MM_MDN: {multiply: 1, offset: 500}
    ML2_NVO_PLAN_DO_MM_MRS: {multiply: 1, offset: 500}
    ML2_P_CONDUITE_NETTE: {multiply: 10, offset: 0}
