[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "previ_r2d2"
version = "0.1.0"
description = "Pipeline IA — reprise automatisée de Previ_v2"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pandas",
    "numpy<2.4",
    "shapely",
    "pyproj",
    "scikit-learn",
    "scipy",
    "pyyaml",
    "lightgbm==4.6.0",
    "optuna==4.6.0",
    "torch==2.12.1",  # installé CPU-only : pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
    "joblib",
    "matplotlib",
    "shap",
    "dvc>=3.0",
    "dvc-http",       # remote DVC DagsHub en https
]

[project.optional-dependencies]
# Délimitation de BV par MNT — lazy-import only (preprocessing/bv/delineation.py),
# jamais exercé : les 2 centrales ont un shapefile connu. Lourd (GDAL/GEOS),
# installé à la demande : pip install -e ".[gis]"
gis = ["pysheds", "rasterio", "geopandas"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-m", "not slow"]
markers = [
    "slow: tests lents (entraînement/prédiction réels, pas de mock) -- exclus par défaut, lancer avec -m slow",
]
