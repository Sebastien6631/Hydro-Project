[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "projet_hydro"
version = "0.1.0"
description = "Pipeline IA — reprise automatisée de Previ_v2"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pandas",
    "numpy",
    "scikit-learn",
    "scipy",
    "pyyaml",
    "lightgbm==4.6.0",
    "optuna==4.6.0",
    "torch==2.12.1",  # build CPU ou CUDA selon la machine : --index-url .../whl/cpu ou .../whl/cu130
    "joblib",
    "matplotlib",
    "shap",
    "dvc>=3.0",
    "dvc-http",       # remote DVC DagsHub en https
    "fastapi",        # API d'inférence (phase 1)
    "uvicorn",
    "prometheus-client",  # métriques /metrics, scrapées par Prometheus (phase 4.1)
    # Pin strict : le client parle a un serveur d'image figee
    # (docker-compose.yml, service mlflow) -- les deux doivent bouger ensemble.
    "mlflow==3.16.0", # suivi d'expériences + registry (phase 2)
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]   # httpx : requis par fastapi.testclient ; ruff : lint CI

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-m", "not slow"]
markers = [
    "slow: tests lents (entraînement/prédiction réels, pas de mock) -- exclus par défaut, lancer avec -m slow",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E/F seulement (pas I/UP/B/SIM) : une passe lint plus stricte reste à faire
# séparément plutôt que de bloquer la CI sur des centaines de warnings de style
# jamais traités jusqu'ici. E501 (ligne trop longue) ignoré : commentaires FR
# longs et volontaires dans ce repo, pas une dette technique.
select = ["E", "F"]
ignore = ["E501"]
