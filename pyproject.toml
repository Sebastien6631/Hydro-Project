[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "previ_r2d2"
version = "0.1.0"
description = "Pipeline IA — reprise automatisée de Previ_v2"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pandas",
    "numpy",
    "scikit-learn",
    "scipy",
    "pyyaml",
    "lightgbm==4.6.0",
    "optuna==4.6.0",
    "torch==2.12.1",  # build CPU ou CUDA selon la machine : --index-url .../whl/cpu ou .../whl/cu130
    "joblib",
    "matplotlib",
    "shap",
    "dvc>=3.0",
    "dvc-http",       # remote DVC DagsHub en https
    "fastapi",        # API d'inférence (phase 1)
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]   # httpx : requis par fastapi.testclient

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-m", "not slow"]
markers = [
    "slow: tests lents (entraînement/prédiction réels, pas de mock) -- exclus par défaut, lancer avec -m slow",
]
